name: harness-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试与 RAG 校验
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install pytest
        run: pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts evals
      - name: Memory layer tests
        run: python -m tests.memory.test_memory_layer
      - name: Progressive skills tests
        run: python -m pytest tests/skills/test_catalog.py -q
      - name: RAG grounding tests
        run: python -m tests.kb.test_grounding
